name: Windows release
on:
  push:
    branches: [codex/windows-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: ${{ matrix.arch }}
      - name: Install fixed dependencies and verify Windows source
        shell: pwsh
        run: |
          npm.cmd ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd run test:windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and install the actual download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $pack = npm.cmd pack --ignore-scripts --json --pack-destination dist | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/windows-release.mjs "dist/$($pack[0].filename)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $folder = (Get-ChildItem dist -Directory -Filter 'CoThink-*').FullName
          # The user-facing cmd launchers must work in a path with spaces and Chinese.
          $install = Join-Path $env:RUNNER_TEMP 'CoThink 中文 test'
          Copy-Item $folder $install -Recurse
          & "$install/install.cmd"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$install/cothink.cmd" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = Join-Path $install 'app/node_modules/cothink-v2'
          "COTHINK_TEST_CLI=$package/bin/cothink.js" >> $env:GITHUB_ENV
          node test/helpers/windows-installed.mjs $package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:COTHINK_TEST_CLI = "$package/bin/cothink.js"
          node --test test/pi-session.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node test/helpers/pi-manual-terminal.mjs --smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path $folder -DestinationPath "$folder.zip"
          Get-FileHash "$folder.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding utf8 dist/SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/setup-python@v5
        if: matrix.arch == 'x64'
        with:
          python-version: '3.12'
      - name: Windows ConPTY with the installed program
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.0.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python test/windows_conpty_checks.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: CoThink-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
